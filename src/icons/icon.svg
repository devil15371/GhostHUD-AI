<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="cyanIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Glowing Ghost HUD Hex / Shield -->
  <path d="M256 96 L396 176 V336 L256 416 L116 336 V176 Z" 
        fill="none" 
        stroke="url(#cyanIndigoGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Central AI Sparkle / Eye -->
  <circle cx="256" cy="256" r="38" fill="url(#cyanIndigoGrad)"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.6"/>
  
  <!-- Corner HUD marks -->
  <line x1="180" y1="176" x2="210" y2="176" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <line x1="302" y1="176" x2="332" y2="176" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="336" x2="210" y2="336" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
  <line x1="302" y1="336" x2="332" y2="336" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
</svg>
